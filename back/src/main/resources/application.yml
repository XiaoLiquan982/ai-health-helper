server:
  port: 8080

langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASH_SCOPE_API_KEY:}
      model-name: deepseek-v3
      log-requests: true
      log-responses: true
  ollama:
    chat-model:
      base-url: http://localhost:11434
      model-name: deepseek-r1:1.5b
      temperature: 0.8
      timeout: PT60S
      log-requests: true
      log-responses: true
  community:
    dashscope:
      chat-model:
        api-key: ${DASH_SCOPE_API_KEY:}
        model-name: qwen-max
      streaming-chat-model:
        api-key: ${DASH_SCOPE_API_KEY:}
        model-name: qwen-plus
      embedding-model:
        api-key: ${DASH_SCOPE_API_KEY:}
        model-name: text-embedding-v3

spring:
  config:
    import: optional:classpath:application-local.yml
  data:
    mongodb:
      uri: mongodb://localhost:27017/chat_memory_db
  datasource:
    url: jdbc:mysql://localhost:3306/guiguxiaozhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: info
